<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="flex items-center justify-center min-h-screen bg-gradient-to-br from-sky-500 to-indigo-600"
  >
    <div class="w-full max-w-md p-6 m-4 bg-white rounded-2xl shadow-xl">
      <h1 class="mb-6 text-3xl font-bold text-center text-gray-800">
        Weather App
      </h1>

      <div class="flex gap-2 mb-6">
        <input
          id="cityInput"
          type="text"
          placeholder="Enter city name"
          class="flex-1 px-4 py-2 text-gray-700 bg-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        <button
          id="getWeather"
          class="px-4 py-2 text-white bg-indigo-600 rounded-lg hover:bg-indigo-700"
        >
          Get Weather
        </button>
      </div>

      <div
        id="weather-info"
        class="hidden p-4 bg-gray-100 rounded-lg text-center"
      >
        <h2 id="cityName" class="text-xl font-semibold text-gray-800"></h2>
        <p id="temperature" class="text-lg text-gray-700"></p>
        <p id="description" class="text-gray-600 capitalize"></p>
      </div>

      <p
        id="error-message"
        class="hidden mt-4 text-sm text-center text-red-600 font-medium"
      >
        Could not fetch weather. Please try again.
      </p>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
